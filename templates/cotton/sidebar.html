{% load static %}
<c-vars mode="workspace" />

<aside id="sidebar" :class="sidebarOpen ? 'w-64' : 'w-16'" class="bg-card border-r border-border flex-shrink-0 flex flex-col transition-all duration-300 ease-in-out overflow-hidden h-full">
  <!-- Sidebar Header with Pixel-Perfect Alignment -->
  <div class="h-14 px-3 border-b border-border flex items-center justify-between shrink-0 box-border bg-card">
    <a href="{% url 'board-home' %}" x-show="sidebarOpen" x-transition class="flex items-center gap-2 min-w-0 overflow-hidden">
      <svg class="h-5 w-5 text-primary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="14" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
      </svg>
      <span class="text-base font-semibold text-foreground whitespace-nowrap overflow-hidden">Taskify</span>
    </a>
    <button @click="sidebarOpen = !sidebarOpen" :class="!sidebarOpen ? 'mx-auto' : ''" class="p-1 hover:bg-accent rounded transition-colors shrink-0" title="Toggle Sidebar">
      <svg class="h-4 w-4 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" />
        <path d="M9 3v18" />
      </svg>
    </button>
  </div>

  <!-- Sidebar Body Content -->
  <nav class="flex-1 p-2 overflow-y-auto space-y-4">
    {% if mode == "board" %}
    <ul class="space-y-1">
      <li>
        <a href="{% url 'board-home' %}" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-accent rounded-md transition-colors" :class="sidebarOpen ? 'justify-start' : 'justify-center !px-0'" :title="!sidebarOpen ? 'Workspaces' : ''">
          <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span x-show="sidebarOpen" x-transition class="whitespace-nowrap">Workspaces</span>
        </a>
      </li>
      <li>
        <button id="open-invite-modal" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-accent rounded-md transition-colors" :class="sidebarOpen ? 'justify-start' : 'justify-center !px-0'" :title="!sidebarOpen ? 'Members' : ''">
          <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span x-show="sidebarOpen" x-transition class="whitespace-nowrap">Members</span>
        </button>
      </li>
      <li>
        <button id="open-background-modal" class="w-full flex items-center gap-2 px-3 py-2 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-accent rounded-md transition-colors" :class="sidebarOpen ? 'justify-start' : 'justify-center !px-0'" :title="!sidebarOpen ? 'Background' : ''">
          <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
          </svg>
          <span x-show="sidebarOpen" x-transition class="whitespace-nowrap">Background</span>
        </button>
      </li>
      <li>
        <a href="{% url 'board-home' %}" class="flex items-center gap-2 px-3 py-2 text-xs font-medium text-muted-foreground hover:text-foreground hover:bg-accent rounded-md transition-colors" :class="sidebarOpen ? 'justify-start' : 'justify-center !px-0'" :title="!sidebarOpen ? 'All Boards' : ''">
          <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="3" width="7" height="7" rx="1" />
            <rect x="14" y="14" width="7" height="7" rx="1" />
            <rect x="3" y="14" width="7" height="7" rx="1" />
          </svg>
          <span x-show="sidebarOpen" x-transition class="whitespace-nowrap">All Boards</span>
        </a>
      </li>
    </ul>
    {% else %}
    <!-- Workspace Navigation -->
    <div class="px-1">
      <c-ui.button @click="openWorkspaceModal()" size="sm" class="w-full text-xs transition-all" :class="sidebarOpen ? 'justify-start gap-2 px-3' : 'justify-center !px-0'" :title="!sidebarOpen ? 'Add Workspace' : ''">
        <svg class="h-4 w-4 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span x-show="sidebarOpen" x-transition class="whitespace-nowrap">Add Workspace</span>
      </c-ui.button>
    </div>

    <!-- Your Workspaces Section -->
    <div>
      <div x-show="sidebarOpen" x-transition class="px-2 mb-1.5">
        <span class="text-[10px] font-bold tracking-wider text-muted-foreground uppercase">Your Workspaces</span>
      </div>
      <div id="workspaceList" class="space-y-1"></div>
    </div>

    <!-- Shared Workspaces Section -->
    <div>
      <div x-show="sidebarOpen" x-transition class="px-2 mb-1.5">
        <span class="text-[10px] font-bold tracking-wider text-muted-foreground uppercase">Shared Workspaces</span>
      </div>
      <div id="workspaceListOthers" class="space-y-1"></div>
    </div>
    {% endif %}
  </nav>

  <!-- Sidebar Footer User Profile -->
  <div class="p-2 border-t border-border shrink-0">
    <a href="{% url 'user-profile' %}" class="flex items-center gap-2 px-2 py-2 hover:bg-accent rounded-md transition-colors" :class="sidebarOpen ? 'justify-start' : 'justify-center !px-0'" :title="!sidebarOpen ? '{{ user.username }}' : ''">
      <div class="h-8 w-8 flex-shrink-0 flex items-center justify-center bg-primary text-primary-foreground rounded-full font-semibold text-sm">
        <span class="hidden" id="self-user">{{ user.id }}</span>
        {{ user.username|slice:":1"|upper }}
      </div>
      <div x-show="sidebarOpen" x-transition class="flex-1 min-w-0">
        <div class="text-xs font-medium text-foreground truncate">{{ user.username }}</div>
        <div class="text-[10px] text-muted-foreground truncate">{{ user.email }}</div>
      </div>
    </a>
  </div>
</aside>
